[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copenguin"
version = "0.1.0"
description = "A local-first personal agent runtime with durable tasks, governed memory, executable knowledge, and safe action boundaries."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agent", "local-first", "runtime", "personal-assistant", "event-sourcing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.9.0",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
feishu = [
  "lark-oapi>=1.7.2,<2",
]
evolve = [
  "evolve-memory @ git+https://github.com/2sao7sao/EvolveMemory.git@c628f00eb0ae5d03fee2e6d5e4208265be115a7d",
  "evolvekb @ git+https://github.com/2sao7sao/EvolveKB.git@cbf093efef56aa8fa3828fd76b400ce6471fe84e",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/2sao7sao/CoPenguin"
Documentation = "https://github.com/2sao7sao/CoPenguin/tree/main/docs"
Issues = "https://github.com/2sao7sao/CoPenguin/issues"
Repository = "https://github.com/2sao7sao/CoPenguin.git"
Changelog = "https://github.com/2sao7sao/CoPenguin/blob/main/CHANGELOG.md"

[project.scripts]
copenguin = "copenguin.cli:main"
# Temporary compatibility entry point for installations of the original MVP.
feishu-agent = "feishu_computer_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feishu_computer_agent = ["control_room_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
