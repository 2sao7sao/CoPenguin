name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull-request-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require an explicit integration target
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >-
          python scripts/check_pr_contract.py
          --base "$PR_BASE"
          --default "${{ github.event.repository.default_branch }}"
          --labels "$PR_LABELS"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q
      - name: Type-check runtime
        run: mypy --ignore-missing-imports src/super_agent_runtime src/copenguin
      - name: Type-check server boundary
        run: mypy --ignore-missing-imports --follow-imports=skip src/feishu_computer_agent/server.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Smoke-test installed CLI
        run: copenguin --help

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build --tag copenguin:ci .
      - name: Run credential-free demo in a read-only container
        run: >-
          docker run --rm --read-only --tmpfs /tmp
          --env COPENGUIN_DATA_DIR=/tmp/copenguin-data
          copenguin:ci copenguin demo --json

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and auditor
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install . pip-audit
      - name: Audit installed runtime dependencies
        run: python -m pip_audit --local
