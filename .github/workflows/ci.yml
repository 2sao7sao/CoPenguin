name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Type-check runtime
        run: mypy --ignore-missing-imports src/super_agent_runtime src/copenguin
      - name: Type-check server boundary
        run: mypy --ignore-missing-imports --follow-imports=skip src/feishu_computer_agent/server.py
