name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag and install release tools
        run: |
          python scripts/verify_release_tag.py "${GITHUB_REF_NAME}"
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e ".[dev]"
      - name: Validate release candidate
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
          pytest -q
          python -m build
          docker build --tag copenguin:release-candidate .
          docker run --rm --read-only --tmpfs /tmp \
            --env COPENGUIN_DATA_DIR=/tmp/copenguin-data \
            copenguin:release-candidate copenguin demo --json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
